name: choppertracker
region: nyc

databases:
  - engine: VALKEY
    name: cache
    production: true
    cluster_name: choppertracker-cache

services:
  - name: api
    dockerfile_path: BackEnd/Dockerfile
    source_dir: BackEnd
    github:
      branch: main
      deploy_on_push: true
      repo: jeffstrout/chopperTracker
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: REDIS_URL
        scope: RUN_TIME
        value: ${cache.DATABASE_URL}
      - key: LOG_LEVEL
        scope: RUN_TIME
        value: INFO
      - key: CONFIG_FILE
        scope: RUN_TIME
        value: collectors.yaml
      - key: ENV
        scope: RUN_TIME
        value: production
      - key: API_BASE_URL
        scope: RUN_TIME
        value: ${_self.PUBLIC_URL}/api/v1
      - key: FRONTEND_URL
        scope: RUN_TIME
        value: ${_self.PUBLIC_URL}
      - key: TZ
        scope: RUN_TIME
        value: America/Chicago
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 30

static_sites:
  - name: frontend
    build_command: npm install && npm run build
    source_dir: FrontEnd
    output_dir: dist
    catchall_document: index.html
    github:
      branch: main
      deploy_on_push: true
      repo: jeffstrout/chopperTracker
    envs:
      - key: VITE_API_BASE_URL
        scope: BUILD_TIME
        value: ${_self.PUBLIC_URL}/api/v1
      - key: VITE_DEFAULT_REGION
        scope: BUILD_TIME
        value: etex

ingress:
  rules:
    - component:
        name: api
        preserve_path_prefix: true
      match:
        path:
          prefix: /api
    - component:
        name: api
        preserve_path_prefix: true
      match:
        path:
          prefix: /health
    - component:
        name: api
        preserve_path_prefix: true
      match:
        path:
          prefix: /docs
    - component:
        name: api
        preserve_path_prefix: true
      match:
        path:
          prefix: /openapi.json
    - component:
        name: api
        preserve_path_prefix: true
      match:
        path:
          prefix: /config.js
    - component:
        name: frontend
      match:
        path:
          prefix: /
