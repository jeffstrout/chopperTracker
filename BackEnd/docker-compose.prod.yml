# Production configuration for Digital Ocean deployment
version: '3.8'

services:
  app:
    build: .
    container_name: choppertracker
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TZ=${TZ:-America/Chicago}
      - CONFIG_FILE=collectors.yaml
      - API_BASE_URL=${API_BASE_URL:-https://api.choppertracker.com/api/v1}
      - ENV=production
      - FRONTEND_URL=${FRONTEND_URL:-https://choppertracker.com}
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config:ro
      - app_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: choppertracker_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  app_logs:
